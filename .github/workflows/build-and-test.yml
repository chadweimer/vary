name: Build & Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPO_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: go build ./...
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - id: lint
        run: |
          go vet ./...
      #    go tool revive -exclude static/... -config=revive.toml ./... > $(ROOT_BUILD_DIR)/revive.golint
      #    go tool gosec -no-fail -fmt=sonarqube -out=$(ROOT_BUILD_DIR)/gosec.json -stdout ./...
      # TODO
      #- id: lint-test
      #  run: make lint test
      - id: test
        run: go test -coverprofile=test-coverage.out -coverpkg=./... -json > test-results.json ./...
      #- name: SonarCloud Scan
      #  if: success() || steps.test.outcome == 'failure' || steps.lint.outcome == 'failure'
      #  uses: SonarSource/sonarqube-scan-action@v7
      #  env:
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
